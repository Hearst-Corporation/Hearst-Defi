# =============================================================================
# nexus-loop.yml — Hearst Nexus headless runner (CANONICAL TEMPLATE)
#
# This is the runner Nexus dispatches via workflow_dispatch. It is the SOURCE OF
# TRUTH: copy it into each TARGET repo (e.g. Hearst-Corporation/Hearst-Defi,
# adrien-debug/nexus-loop-sandbox) under .github/workflows/. It is dispatch-only
# (no push/PR triggers) so it never auto-runs on the Nexus control-plane repo.
#
# EXECUTION — READ docs/RUNNER_INFRA.md BEFORE TOUCHING THIS:
#   Runs on the SELF-HOSTED gpu1 runner, authenticated by the Claude Max
#   SUBSCRIPTION (OAuth token from ~/.nexus-claude.env), NOT a metered sk-ant API
#   key. `unset ANTHROPIC_API_KEY` forces subscription auth so no credit is spent.
#   NEVER switch to ubuntu-latest / npm install -g @anthropic-ai/claude-code /
#   ANTHROPIC_API_KEY — that path hits "Credit balance is too low".
#
# TWO MODES (input `mode`):
#   default  (health/ux/preprod) → create branch `nexus/<run_label>`, run agents,
#            commit, push, and OPEN a new PR into the base branch.
#   pr_fix   → PATCH an EXISTING pull request in place: check out its existing
#            head branch (`target_head_ref`), commit fixes, push to the SAME
#            branch. NEVER create a new branch or a new PR. NEVER merge/close.
#            If the remote head branch is absent → STOP (fail closed).
#
# PERMISSION BOUNDARY: agents edit/test/commit/push a branch and open/update a PR.
# They NEVER merge or push the default branch, deploy, touch secrets, or run
# destructive DB ops. Adrien merges (from the Nexus cockpit). No auto-merge.
# =============================================================================
name: Nexus Loop

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Mission prompt forwarded verbatim to the agent(s)
        required: true
        type: string
      run_label:
        description: Nexus run label (used for the default-mode branch name)
        required: true
        type: string
      model:
        description: Model id (opus|sonnet|gemini)
        required: false
        default: opus
        type: string
      agents:
        description: Number of sequential agents to run
        required: false
        default: "1"
        type: string
      identity_check:
        description: "true = resolve/log Claude account only, skip model execution"
        required: false
        default: "false"
        type: string
      # ── pr_fix inputs (optional; only sent by Nexus for pr.fix runs) ──────────
      mode:
        description: "default | pr_fix"
        required: false
        default: default
        type: string
      target_pr_number:
        description: (pr_fix) the PR number to patch
        required: false
        default: ""
        type: string
      target_head_ref:
        description: (pr_fix) the EXISTING head branch to patch in place
        required: false
        default: ""
        type: string
      target_base_ref:
        description: (pr_fix) the PR base branch (for context only; never targeted)
        required: false
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nexus-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, gpu1]
    # Hard ceiling so a wedged run (agent hung, network stall) can't burn the
    # 6h GitHub default. The daemon's staleness backstop (45 min, see
    # src/lib/runs/reconcile-core.ts RUN_STALENESS_THRESHOLD_MS) sits above this,
    # so a job that hits this timeout is observed as `completed`/failed and
    # reconciled — never left dangling.
    timeout-minutes: 30
    env:
      # Fallback only. On the self-hosted runner this is normally EMPTY and the
      # agent authenticates via the resolved OAuth slot. It is
      # referenced here (never inline) so target-repo copies that DO set the GH
      # secret keep working; `unset ANTHROPIC_API_KEY` below forces subscription
      # auth regardless. See docs/RUNNER_INFRA.md.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO_FULL_NAME: ${{ github.repository }}
      MODE: ${{ inputs.mode }}
      RUN_LABEL: ${{ inputs.run_label }}
      MISSION: ${{ inputs.prompt }}
      MODEL: ${{ inputs.model }}
      AGENTS: ${{ inputs.agents }}
      IDENTITY_CHECK: ${{ inputs.identity_check }}
      TARGET_PR: ${{ inputs.target_pr_number }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Resolve the working branch ─────────────────────────────────────────
      # pr_fix: check out the EXISTING head branch; STOP if it's not on the
      # remote (refusing prevents accidentally creating a new branch/PR).
      # default: create a fresh nexus/<run_label> branch from the current ref.
      - name: Resolve branch
        id: branch
        shell: bash -l {0}
        run: |
          set -euo pipefail
          git config user.name "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          if [ "$MODE" = "pr_fix" ]; then
            if [ -z "$TARGET_HEAD_REF" ]; then
              echo "::error::pr_fix requires target_head_ref"; exit 1
            fi
            if ! git ls-remote --exit-code --heads origin "$TARGET_HEAD_REF" >/dev/null 2>&1; then
              echo "::error::Remote branch '$TARGET_HEAD_REF' not found — refusing to create a new PR."
              exit 1
            fi
            git fetch origin "$TARGET_HEAD_REF"
            git checkout -B "$TARGET_HEAD_REF" "origin/$TARGET_HEAD_REF"
            echo "branch=$TARGET_HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "→ pr_fix mode: patching existing PR #$TARGET_PR on $TARGET_HEAD_REF"
          else
            BR="nexus/$RUN_LABEL"
            git checkout -B "$BR"
            echo "branch=$BR" >> "$GITHUB_OUTPUT"
            echo "→ default mode: new branch $BR"
          fi

      - name: Resolve Claude account
        id: claude_account
        shell: bash -l {0}
        run: |
          set -euo pipefail
          python3 ".github/scripts/resolve-active-claude-account.py" \
            --repo "$REPO_FULL_NAME" \
            --run-label "$RUN_LABEL" \
            > "$RUNNER_TEMP/claude-account.json"
          python3 - <<'PY'
          import json, os
          data = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "claude-account.json"), "r", encoding="utf-8"))
          line = (
              f"→ claude auth: account '{data['account_id']}' source '{data['source']}' "
              f"label '{data['label_masked'] or 'n/a'}' env '{data['env_file']}' "
              f"resolved_at '{data['resolved_at']}' "
              f"token_fingerprint '{data['token_fingerprint'] or 'n/a'}' "
              f"session_fingerprint '{data['session_fingerprint'] or 'n/a'}'"
          )
          print(line)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for key in ("repo", "account_id", "label_masked", "source", "resolved_at", "env_file", "env_file_is_legacy", "token_fingerprint", "session_file", "session_fingerprint", "legacy_file", "legacy_fingerprint"):
                  fh.write(f"{key}={data.get(key, '')}\n")
          PY

      # ── Run the agent fleet ────────────────────────────────────────────────
      # Real Claude Code invocation on the SELF-HOSTED gpu1 runner. Authenticated
      # by the Claude Max subscription (OAuth token in the resolved slot file) — NOT
      # a metered API key. `unset ANTHROPIC_API_KEY` guarantees subscription auth
      # even if a GH secret leaked one into the env. $AGENTS sequential agents run
      # against $MISSION; each pass sees the previous pass's edits. A failing agent
      # invocation must NOT hard-fail the run — a no-op (empty diff) is a legitimate
      # health-check outcome — UNLESS the failure is an account/environment error
      # (which produces no code and must not masquerade as a clean no-op).
      - name: Run Claude Code agents
        if: ${{ inputs.identity_check != 'true' }}
        shell: bash -l {0}
        run: |
          set -uo pipefail
          export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; nvm use 20 >/dev/null 2>&1 || true
          # Load the resolved Claude subscription slot (OAuth token), then FORCE
          # subscription auth by clearing any metered API key. See RUNNER_INFRA.md.
          set -a; [ -f "${{ steps.claude_account.outputs.env_file }}" ] && . "${{ steps.claude_account.outputs.env_file }}"; set +a
          unset ANTHROPIC_API_KEY   # subscription auth only, never metered credit

          # ── TRUST the workspace (root cause of the false no-ops) ──────────────
          # Claude Code gates ALL Bash behind a per-workspace "trust dialog". On a
          # headless runner that dialog can never be answered, so every command —
          # even with --dangerously-skip-permissions, which only skips permission
          # PROMPTS, not the trust barrier — was refused. Symptom in the logs:
          # "Ignoring N permissions.allow entries: this workspace has not been
          # trusted." The agents then burned all 40 turns unable to run
          # typecheck/test and collapsed to a false no-op (0 files, no PR).
          # Fix: pre-mark THIS workspace hasTrustDialogAccepted:true in
          # ~/.claude.json before the agent starts. Idempotent, survives the
          # ephemeral runner (re-applied every run), scoped to the checkout dir.
          WS="$(pwd)"
          CLAUDE_JSON="$HOME/.claude.json"
          CLAUDE_JSON="$CLAUDE_JSON" WS="$WS" node -e '
            const fs = require("fs");
            const p = process.env.CLAUDE_JSON, ws = process.env.WS;
            let c = {};
            try { c = JSON.parse(fs.readFileSync(p, "utf8")); } catch {}
            c.projects = c.projects || {};
            c.projects[ws] = { ...(c.projects[ws] || {}), hasTrustDialogAccepted: true };
            // A first-run global flag some versions also consult before any project.
            c.hasCompletedProjectOnboarding = true;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log("trusted workspace:", ws);
          ' || echo "::warning::could not pre-trust workspace — Bash may be blocked"

          # Map the loop model (opus|sonnet|gemini) to a Claude model id.
          case "${MODEL:-opus}" in
            opus)   CLAUDE_MODEL="claude-opus-4-8" ;;
            sonnet) CLAUDE_MODEL="claude-sonnet-5" ;;
            gemini) CLAUDE_MODEL="claude-sonnet-5"
                    echo "::warning::model 'gemini' is not supported by Claude Code — falling back to sonnet." ;;
            *)      CLAUDE_MODEL="claude-sonnet-5" ;;
          esac
          echo "Running ${AGENTS:-1} agent(s) on ${CLAUDE_MODEL} (self-hosted gpu1, subscription OAuth)"

          # Runner preamble — prepended to EVERY mission. The target repo (and the
          # user's global config) may carry a "RULE 0 / worker = never touch git,
          # leave changes for the integrator" doctrine. On this runner that doctrine
          # is INVERTED: the agent IS the producer and MUST write files to the
          # working tree; the workflow (not the agent) stages/commits/pushes/opens
          # the PR. Without this, the agent reads "workers never produce", writes
          # nothing, and the run collapses to a false no-op (no PR). Built with
          # printf (no embedded quotes) so it stays a safe single shell string.
          PREAMBLE=$(printf '%s\n' \
            'SYSTEM — RUNNER EXECUTION CONTEXT (overrides any conflicting repo or global doctrine):' \
            'You are running headless on the Nexus CI runner. You ARE the worker that PRODUCES the change.' \
            'You MUST create and edit the real files in the working tree to accomplish the mission.' \
            'Do NOT refuse to write, and do NOT leave the work for an integrator or for Adrien to do later —' \
            'writing the files IS your job here. You must NOT run git yourself (no commit, push or merge):' \
            'the workflow stages, commits, pushes the branch and opens the PR AFTER you finish.' \
            'A genuine no-op (mission already satisfied) is fine, but declining to produce because a worker' \
            'should not touch git is NOT valid here. Now execute the mission below:' \
            '')

          fail=0
          for i in $(seq 1 "${AGENTS:-1}"); do
            echo "── Agent $i/${AGENTS:-1} ──"
            set +e
            # The mission is fed on STDIN, never as a positional arg: a mission
            # that starts with '--' (e.g. a "--- METADATA ---" header) would be
            # parsed by the CLI as an unknown OPTION and the agent would never run.
            # With no positional prompt, `claude --print` reads it from stdin —
            # also immune to the arg-length cap for very large missions. The runner
            # preamble is prepended so the agent produces instead of deferring.
            #
            # --dangerously-skip-permissions: on this headless CI runner the
            # workspace is NOT "trusted", so the previous --permission-mode
            # acceptEdits let the agent edit files but BLOCKED Bash — it could not
            # run `pnpm typecheck`/`test` to diagnose failing checks, burned all 40
            # turns and gave up (the pr_fix runs that "took 30 min and fixed
            # nothing"). This is a controlled, ephemeral runner: the agent must be
            # able to execute the repo's own validation commands, so we bypass the
            # trust dialog + permission prompts here (never on a dev's machine).
            out="$(printf '%s\n%s' "$PREAMBLE" "$MISSION" | claude --print \
              --model "$CLAUDE_MODEL" \
              --dangerously-skip-permissions \
              --max-turns 40 \
              2>&1)"
            code=$?
            set -e
            printf '%s\n' "$out"
            if [ $code -ne 0 ]; then
              # A CLI invocation/parse error means the agent NEVER RAN — that is a
              # hard failure, NOT a clean no-op (a no-op is the agent running and
              # choosing to change nothing). Fail the run so it can't masquerade as
              # success. Same for account/environment errors (no code produced).
              if printf '%s' "$out" | grep -qiE "unknown option|unknown argument|invalid option|error: unknown|usage:|missing required|credit balance is too low|insufficient|quota|weekly limit|session limit|authentication|invalid api key|unauthorized|rate limit|oauth"; then
                echo "::error::Agent $i did not run — CLI/parse or account error (no code produced). First line: $(printf '%s' "$out" | head -n1)"
                fail=1
                break
              fi
              echo "::warning::agent $i exited non-zero — treating as a possible no-op and continuing."
            fi
          done
          if [ "$fail" -eq 1 ]; then exit 1; fi

      # ── Commit + push (mode-aware) ─────────────────────────────────────────
      - name: Commit and push
        if: ${{ inputs.identity_check != 'true' }}
        id: push
        shell: bash -l {0}
        run: |
          set -euo pipefail
          BRANCH="${{ steps.branch.outputs.branch }}"
          git add -A
          # No-diff is a clean success; if/else avoids a mid-script exit that a
          # login shell can turn into a spurious non-zero status.
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "→ No diff — no changes were necessary / no fix was produced."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "chore(nexus): ${MODE} run ${RUN_LABEL}"
            # Push to the SAME branch in both modes; pr_fix pushes to the existing head.
            git push origin "HEAD:$BRANCH"
          fi

      # ── Detect real changes (default mode only) ───────────────────────────────
      # The index holds the fleet's staged delta. git diff --cached vs
      # origin/<base> is the right check: it catches noise changes that weren't
      # reverted and reports no-op when the agent touched nothing useful.
      - name: Detect changes against base (default mode only)
        id: detect
        if: ${{ inputs.identity_check != 'true' && inputs.mode != 'pr_fix' }}
        shell: bash -l {0}
        run: |
          set -euo pipefail
          BASE_REF="${TARGET_BASE_REF:-main}"
          git fetch origin "$BASE_REF" --quiet
          if git diff --cached --quiet "origin/${BASE_REF}"; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "→ No staged diff vs origin/${BASE_REF} — health check no-op, skipping PR."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "→ Staged changes detected vs origin/${BASE_REF} — will open PR."
          fi

      # ── Open a PR — DEFAULT MODE ONLY, only when real changes exist. ─────────
      # Uses the GitHub REST API via curl, NOT the `gh` CLI: the self-hosted gpu1
      # runner does not ship `gh` on its PATH, and a template must be self-contained.
      # A pre-existing open PR for this head (HTTP 422) is a clean success, not a
      # failure. Any OTHER non-2xx is a real error and FAILS the step (never masked
      # by `|| true` — a run that produced a diff but no PR must not report success).
      - name: Open pull request (default mode only)
        if: ${{ inputs.identity_check != 'true' && inputs.mode != 'pr_fix' && steps.push.outputs.changed == 'true' && steps.detect.outputs.has_changes == 'true' }}
        shell: bash -l {0}
        env:
          REPO: ${{ github.repository }}
          # GATE-HOLE FIX: open the PR with NEXUS_PAT, NOT the job-level
          # github.token. GitHub's anti-recursion rule suppresses workflow runs for
          # events (incl. pull_request) triggered by GITHUB_TOKEN, so this repo's
          # real CI never fired on nexus/* PRs — the Nexus daemon then auto-merged
          # on Vercel-green alone and pushed a red main. A PAT-opened PR fires
          # pull_request so CI runs and can actually gate the auto-merge. The
          # pr_fix comment step below deliberately keeps github.token (it must NOT
          # re-trigger CI). Env-referenced only, never inlined.
          GH_TOKEN: ${{ secrets.NEXUS_PAT }}
        run: |
          set -euo pipefail
          export BRANCH="${{ steps.branch.outputs.branch }}"
          export BASE="${TARGET_BASE_REF:-main}"
          export BODY="Automated Nexus run ${RUN_LABEL}. <!--nexus:agents {\"schemaVersion\":1,\"agents\":[]} nexus:agents-->"
          PAYLOAD=$(python3 -c "import json,os; print(json.dumps({'title': f\"nexus: {os.environ['RUN_LABEL']}\", 'head': os.environ['BRANCH'], 'base': os.environ['BASE'], 'body': os.environ['BODY']}))")
          HTTP=$(curl -s -o /tmp/pr-resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls" \
            -d "$PAYLOAD")
          if [ "$HTTP" = "201" ]; then
            echo "→ PR opened: $(python3 -c 'import json;print(json.load(open("/tmp/pr-resp.json"))["html_url"])')"
          elif [ "$HTTP" = "422" ] && grep -q "already exists\|pull request already exists" /tmp/pr-resp.json; then
            echo "→ A PR for $BRANCH already exists — nothing to do."
          else
            echo "::error::PR creation failed (HTTP $HTTP): $(cat /tmp/pr-resp.json)"
            exit 1
          fi

      # ── pr_fix: report back on the EXISTING PR (no new PR) ──────────────────
      - name: Comment on the patched PR (pr_fix mode)
        if: ${{ inputs.identity_check != 'true' && inputs.mode == 'pr_fix' && steps.push.outputs.changed == 'true' && inputs.target_pr_number != '' }}
        shell: bash -l {0}
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export BODY="Nexus pr.fix run ${RUN_LABEL} pushed fixes to ${TARGET_HEAD_REF}."
          PAYLOAD=$(python3 -c "import json,os; print(json.dumps({'body': os.environ['BODY']}))")
          curl -s -o /dev/null -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${TARGET_PR}/comments" \
            -d "$PAYLOAD" \
          || echo "::warning::could not comment on PR #$TARGET_PR"
