name: nexus-loop

# Dispatched by Hearst Nexus. Runs a SEQUENTIAL FLEET of Claude Code agents on the
# self-hosted GPU runner, authenticated by the Max subscription (OAuth token) — NOT
# the API key. Each agent is a real `claude -p` pass with a distinct role; the count
# comes from the loop's maxAgents (input `agents`). Never pushes to the default branch.
# Workflow artifacts are kept in $RUNNER_TEMP so they never land in the PR.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Mission for Claude Code (already carries scope + policies)'
        required: true
        type: string
      run_label:
        description: 'Nexus run id / label'
        required: false
        default: 'manual'
        type: string
      model:
        description: 'Model alias (opus | sonnet | gemini)'
        required: false
        default: 'opus'
        type: string
      agents:
        description: 'Number of sequential Claude agents to run (fan-out fleet size)'
        required: false
        default: '1'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nexus-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, gpu1]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run agent fleet (sequential fan-out)
        id: fleet
        shell: bash -l {0}
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; nvm use 20 >/dev/null
          set -a; [ -f "$HOME/.nexus-claude.env" ] && . "$HOME/.nexus-claude.env"; set +a
          unset ANTHROPIC_API_KEY   # force subscription auth, never metered credit

          TMP="$RUNNER_TEMP"
          N="${{ inputs.agents }}"; N="${N:-1}"
          case "$N" in ''|*[!0-9]*) N=1 ;; esac
          [ "$N" -lt 1 ] && N=1
          MODEL="${{ inputs.model }}"; MODEL="${MODEL:-opus}"
          ROLES=(architect coder tester reviewer refactorer documenter optimizer integrator analyst hardener cleaner planner builder verifier auditor finisher)

          echo "Nexus run ${{ inputs.run_label }} — fleet of $N agent(s), model $MODEL"
          # Base checkpoint so each agent's file delta is measurable precisely.
          BASE=$(git rev-parse HEAD)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          git config user.email "nexus-bot@hearst.app"
          git config user.name "nexus-bot"
          git add -A && git commit -q --allow-empty -m "nexus base ${{ inputs.run_label }}"

          : > "$TMP/agent-rows.txt"
          for i in $(seq 0 $((N-1))); do
            ROLE="${ROLES[$i]:-agent-$((i+1))}"
            echo "──── agent $((i+1))/$N : $ROLE ────"
            AGENT_PROMPT="You are the ${ROLE} agent (agent $((i+1)) of ${N}) in a sequential fleet working the same checkout. Build on the prior agents' changes; do not redo their work. ${{ inputs.prompt }}"
            claude -p "$AGENT_PROMPT" \
              --permission-mode acceptEdits \
              --allowedTools "Edit,Write,Bash(npm test)" \
              --model "$MODEL" \
              --output-format json \
              > "$TMP/claude-$i.json" 2> "$TMP/claude-$i.err" || true
            if grep -q '"is_error":true' "$TMP/claude-$i.json" 2>/dev/null; then ST=error; else ST=done; fi
            git add -A
            NF=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -q --allow-empty -m "nexus agent $i ($ROLE)"
            echo "$i|$ROLE|$ST|$NF" >> "$TMP/agent-rows.txt"
            echo "agent $ROLE → status=$ST files=$NF"
          done
          echo "---- agent-rows ----"; cat "$TMP/agent-rows.txt"

      - name: Run tests (validation gate)
        id: tests
        shell: bash -l {0}
        run: |
          export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; nvm use 20 >/dev/null
          if npm test 2>&1 | tee "$RUNNER_TEMP/test-output.txt"; then
            echo "status=done" >> "$GITHUB_OUTPUT"
          else
            echo "tests failed (PR still opens for review)"
            echo "status=error" >> "$GITHUB_OUTPUT"
          fi

      - name: Build manifest + PR body
        shell: bash -l {0}
        run: |
          set -e
          TMP="$RUNNER_TEMP"
          MODEL="${{ inputs.model }}"; MODEL="${MODEL:-opus}"
          python3 - "$MODEL" < "$TMP/agent-rows.txt" > "$TMP/agents-manifest.json" <<'PY'
          import json, sys
          model = sys.argv[1]
          agents = []
          for line in sys.stdin:
              line = line.strip()
              if not line:
                  continue
              idx, role, st, nf = line.split('|')
              agents.append({"index": int(idx), "role": role, "model": model, "status": st, "filesTouched": int(nf)})
          if not agents:
              agents = [{"index": 0, "role": "agent", "model": model, "status": "done", "filesTouched": 0}]
          print(json.dumps({"schemaVersion": 1, "model": model, "agents": agents}))
          PY
          echo "---- agents-manifest.json ----"; cat "$TMP/agents-manifest.json"

          {
            echo "Automated by **Hearst Nexus** loop run \`${{ inputs.run_label }}\` — fleet of ${{ inputs.agents }} agent(s)."
            echo
            echo "**Mission:** ${{ inputs.prompt }}"
            echo
            echo "Review before merge — Nexus never auto-merges."
            echo
            echo "<!--nexus:agents"
            cat "$TMP/agents-manifest.json"
            echo "nexus:agents-->"
          } > "$TMP/pr-body.md"

          # Collapse all per-agent checkpoint commits back to base so create-pull-request
          # bundles the fleet's real file changes as one PR. Artifacts live in $TMP, never
          # in the working tree, so nothing extra leaks into the PR.
          git reset --soft "${{ steps.fleet.outputs.base }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: nexus/${{ inputs.run_label }}
          base: main
          title: "nexus-loop: ${{ inputs.run_label }}"
          commit-message: "nexus-loop: apply ${{ inputs.agents }}-agent fleet changes (${{ inputs.run_label }})"
          body-path: ${{ runner.temp }}/pr-body.md
          delete-branch: true
