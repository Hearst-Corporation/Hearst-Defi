name: nexus-loop

# Dispatched by Hearst Nexus. Runs a SEQUENTIAL FLEET of Claude Code agents on the
# self-hosted GPU runner, authenticated by the Max subscription (OAuth token) — NOT
# the API key. Each agent is a real `claude -p` pass with a distinct role; the count
# comes from the loop's maxAgents (input `agents`). Never pushes to the default branch.
# Workflow artifacts are kept in $RUNNER_TEMP so they never land in the PR.
#
# TWO MODES (input `mode`):
#   default → run agents, collapse to a single delta, detect real changes vs main,
#             and ONLY open a PR when there is a genuine diff. No-op runs exit
#             cleanly without creating a branch or PR.
#   pr_fix  → PATCH an EXISTING pull request in place: check out its existing head
#             branch (`target_head_ref`), run the agents, commit fixes, and push to
#             the SAME branch. NEVER creates a new branch or a new PR. NEVER merges.
#             Fails closed if the target inputs are missing, if the head ref is the
#             protected default branch, or if the remote head branch is absent.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Mission for Claude Code (already carries scope + policies)'
        required: true
        type: string
      run_label:
        description: 'Nexus run id / label'
        required: false
        default: 'manual'
        type: string
      model:
        description: 'Model alias (opus | sonnet | gemini)'
        required: false
        default: 'opus'
        type: string
      agents:
        description: 'Number of sequential Claude agents to run (fan-out fleet size)'
        required: false
        default: '1'
        type: string
      validation:
        description: 'Validation commands, one per line — ALL must pass or no PR opens. Empty → npm test.'
        required: false
        default: ''
        type: string
      # ── pr_fix inputs (only sent by Nexus for pr.fix runs) ───────────────────
      mode:
        description: 'Run mode: default or pr_fix'
        required: false
        default: 'default'
        type: string
      target_pr_number:
        description: 'PR number to patch in pr_fix mode'
        required: false
        default: ''
        type: string
      target_head_ref:
        description: 'Existing PR head branch to patch'
        required: false
        default: ''
        type: string
      target_base_ref:
        description: 'PR base branch'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nexus-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, gpu1]
    env:
      MODE: ${{ inputs.mode }}
      TARGET_PR: ${{ inputs.target_pr_number }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      GH_TOKEN: ${{ github.token }}
      # User-controlled free-form input — routed through env so the shell never
      # re-parses it. Interpolating ${{ inputs.prompt }} directly inside a bash
      # string lets a prompt containing a double-quote / backtick / $() break the
      # string (exit 127) or inject commands. Reference it as "$PROMPT" instead.
      PROMPT: ${{ inputs.prompt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Real dependencies before anything runs. Without this the agents' and
      # the gate's npm scripts die on missing binaries (`prisma: not found`),
      # which silently degraded the validation gate to a no-op.
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; nvm use 20 >/dev/null
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile --prefer-offline
          elif [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # ── pr_fix: validate inputs and check out the EXISTING head branch ───────
      # Fails closed (clear message, no stack trace) on any missing target input,
      # on a head ref that is the protected default branch, or on an absent remote
      # branch — so a pr_fix run can NEVER fall through to creating a new PR or
      # touching main. Skipped entirely in default mode.
      - name: Resolve pr_fix target
        id: prfix
        if: ${{ inputs.mode == 'pr_fix' }}
        shell: bash -l {0}
        run: |
          set -e
          if [ -z "$TARGET_HEAD_REF" ]; then
            echo "pr_fix: missing target_head_ref"; exit 1
          fi
          if [ -z "$TARGET_BASE_REF" ]; then
            echo "pr_fix: missing target_base_ref"; exit 1
          fi
          if [ -z "$TARGET_PR" ]; then
            echo "pr_fix: missing target_pr_number"; exit 1
          fi
          case "$TARGET_HEAD_REF" in
            main|master)
              echo "Refusing to patch protected default branch"
              exit 1
              ;;
          esac
          if ! git ls-remote --exit-code --heads origin "$TARGET_HEAD_REF" >/dev/null 2>&1; then
            echo "pr_fix: remote branch '$TARGET_HEAD_REF' not found — refusing to create a new PR"
            exit 1
          fi
          git config user.email "nexus-bot@hearst.app"
          git config user.name "nexus-bot"
          git fetch origin "$TARGET_HEAD_REF"
          git checkout -B "$TARGET_HEAD_REF" "origin/$TARGET_HEAD_REF"
          echo "→ pr_fix: patching existing PR #$TARGET_PR on $TARGET_HEAD_REF"

      - name: Run agent fleet (sequential fan-out)
        id: fleet
        shell: bash -l {0}
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; nvm use 20 >/dev/null
          set -a; [ -f "$HOME/.nexus-claude.env" ] && . "$HOME/.nexus-claude.env"; set +a
          unset ANTHROPIC_API_KEY   # force subscription auth, never metered credit

          TMP="$RUNNER_TEMP"
          N="${{ inputs.agents }}"; N="${N:-1}"
          case "$N" in ''|*[!0-9]*) N=1 ;; esac
          [ "$N" -lt 1 ] && N=1
          MODEL="${{ inputs.model }}"; MODEL="${MODEL:-opus}"
          ROLES=(architect coder tester reviewer refactorer documenter optimizer integrator analyst hardener cleaner planner builder verifier auditor finisher)

          # ── Live progress bus → Nexus. GitHub's API withholds job logs until the
          # job completes; the Nexus Postgres runs ON THIS BOX, so each progress
          # event is inserted locally and the Nexus run page streams it live.
          # Best-effort by design: a dead bus must never break a run.
          RUN_LABEL="${{ inputs.run_label }}"
          progress() {
            # SQL via STDIN, not -c: psql only interpolates -v variables when the
            # command comes from stdin — with -c the :'var' syntax is a hard error.
            printf '%s' "INSERT INTO run_progress (run_label, line) VALUES (:'rl', left(:'ln', 2000));" \
              | docker exec -i nexus-postgres psql -U postgres -d nexus -q \
                  -v rl="$RUN_LABEL" -v ln="[$(date -u +%H:%M:%S)] $1" \
                  >/dev/null 2>&1 || true
          }
          # Retention: the bus is a live window, not an archive (full logs land in
          # the run row at reconcile). Prune anything older than 7 days.
          docker exec -i nexus-postgres psql -U postgres -d nexus -q \
            -c "DELETE FROM run_progress WHERE created_at < now() - interval '7 days';" >/dev/null 2>&1 || true

          echo "Nexus run ${{ inputs.run_label }} — fleet of $N agent(s), model $MODEL"
          progress "fleet dispatched — $N agent(s), model $MODEL"
          # Base checkpoint so each agent's file delta is measurable precisely.
          BASE=$(git rev-parse HEAD)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          git config user.email "nexus-bot@hearst.app"
          git config user.name "nexus-bot"
          git add -A && git commit -q --allow-empty -m "nexus base ${{ inputs.run_label }}"

          : > "$TMP/agent-rows.txt"
          for i in $(seq 0 $((N-1))); do
            ROLE="${ROLES[$i]:-agent-$((i+1))}"
            echo "──── agent $((i+1))/$N : $ROLE ────"
            progress "agent $((i+1))/$N ($ROLE) started"
            AGENT_PROMPT="You are the ${ROLE} agent (agent $((i+1)) of ${N}) in a sequential fleet working the same checkout. Build on the prior agents' changes; do not redo their work. ${PROMPT}"
            claude -p "$AGENT_PROMPT" \
              --permission-mode acceptEdits \
              --allowedTools "Edit,Write,Bash(npm test)" \
              --model "$MODEL" \
              --output-format json \
              > "$TMP/claude-$i.json" 2> "$TMP/claude-$i.err" || true
            if grep -q '"is_error":true' "$TMP/claude-$i.json" 2>/dev/null; then ST=error; else ST=done; fi
            git add -A
            NF=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -q --allow-empty -m "nexus agent $i ($ROLE)"
            echo "$i|$ROLE|$ST|$NF" >> "$TMP/agent-rows.txt"
            echo "agent $ROLE → status=$ST files=$NF"
            progress "agent $((i+1))/$N ($ROLE) → status=$ST files=$NF"
            if [ "$ST" = "error" ]; then
              ERRMSG=$(python3 -c "import json;print((json.load(open('$TMP/claude-$i.json')).get('result') or '')[:200])" 2>/dev/null || true)
              echo "::warning::agent $ROLE errored: ${ERRMSG:-see $TMP/claude-$i.err}"
              progress "agent $((i+1))/$N ($ROLE) ERROR: ${ERRMSG:-see runner logs}"
            fi
          done
          echo "---- agent-rows ----"; cat "$TMP/agent-rows.txt"
          # A fleet where EVERY agent errored must fail loudly — a silent clean
          # no-op here reads as "repo healthy" when nothing was even attempted
          # (e.g. subscription session limit → instant 429 on each agent).
          if ! grep -q "|done|" "$TMP/agent-rows.txt"; then
            progress "ALL agents errored — failing the run, nothing was attempted"
            echo "::error::every agent errored — see the warnings above (rate limit? auth?)"
            exit 1
          fi
          progress "fleet complete — entering validation gate"

      # ── Validation gate. Runs the LOOP'S OWN validation commands (input
      # `validation`, one per line; falls back to `npm test`). ALL must pass:
      # a red gate STOPs the run and NO PR opens — the doctrine's "never ship
      # red", now enforced instead of merely instructed. ──────────────────────
      - name: Run validation gate
        id: tests
        shell: bash -l {0}
        env:
          VALIDATION: ${{ inputs.validation }}
        run: |
          export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; nvm use 20 >/dev/null
          RUN_LABEL="${{ inputs.run_label }}"
          progress() {
            # SQL via STDIN, not -c: psql only interpolates -v variables when the
            # command comes from stdin — with -c the :'var' syntax is a hard error.
            printf '%s' "INSERT INTO run_progress (run_label, line) VALUES (:'rl', left(:'ln', 2000));" \
              | docker exec -i nexus-postgres psql -U postgres -d nexus -q \
                  -v rl="$RUN_LABEL" -v ln="[$(date -u +%H:%M:%S)] $1" \
                  >/dev/null 2>&1 || true
          }
          CMDS="$VALIDATION"
          [ -z "$CMDS" ] && CMDS="npm test"
          : > "$RUNNER_TEMP/test-output.txt"
          while IFS= read -r CMD; do
            [ -z "$CMD" ] && continue
            progress "validation gate — running: $CMD"
            if bash -lc "$CMD" 2>&1 | tee -a "$RUNNER_TEMP/test-output.txt"; then
              progress "validation gate — passed: $CMD"
            else
              progress "validation gate → FAILED: $CMD — STOP, no PR"
              echo "status=error" >> "$GITHUB_OUTPUT"
              echo "::error::validation gate failed on: $CMD — no PR will be opened"
              exit 1
            fi
          done <<< "$CMDS"
          echo "status=done" >> "$GITHUB_OUTPUT"
          progress "validation gate → all commands passed"

      - name: Build manifest + PR body
        shell: bash -l {0}
        run: |
          set -e
          TMP="$RUNNER_TEMP"
          MODEL="${{ inputs.model }}"; MODEL="${MODEL:-opus}"
          # Rows come in via argv/open(), NOT stdin: `python3 -` already consumes
          # stdin for the program itself, so a `< file` redirect here is silently
          # swallowed by the heredoc and the manifest degrades to the fallback
          # single agent (the "1 generic agent, 0 files" bug).
          python3 - "$MODEL" "$TMP/agent-rows.txt" > "$TMP/agents-manifest.json" <<'PY'
          import json, sys
          model = sys.argv[1]
          agents = []
          for line in open(sys.argv[2], encoding='utf-8'):
              line = line.strip()
              if not line:
                  continue
              idx, role, st, nf = line.split('|')
              agents.append({"index": int(idx), "role": role, "model": model, "status": st, "filesTouched": int(nf)})
          if not agents:
              agents = [{"index": 0, "role": "agent", "model": model, "status": "done", "filesTouched": 0}]
          print(json.dumps({"schemaVersion": 1, "model": model, "agents": agents}))
          PY
          echo "---- agents-manifest.json ----"; cat "$TMP/agents-manifest.json"

          {
            echo "Automated by **Hearst Nexus** loop run \`${{ inputs.run_label }}\` — fleet of ${{ inputs.agents }} agent(s)."
            echo
            echo "**Mission:** ${PROMPT}"
            echo
            echo "Review before merge — Nexus never auto-merges."
            echo
            echo "<!--nexus:agents"
            cat "$TMP/agents-manifest.json"
            echo "nexus:agents-->"
          } > "$TMP/pr-body.md"

      # ── DEFAULT MODE: collapse to base so create-pull-request bundles the
      # fleet's real file changes as one PR. pr_fix never runs this. ────────────
      - name: Collapse fleet commits (default mode only)
        if: ${{ inputs.mode != 'pr_fix' }}
        shell: bash -l {0}
        run: |
          set -e
          # The PR must contain EXACTLY the fleet's committed delta. Anything
          # the validation gate dirtied after the last agent commit (e.g. a
          # pretest provider switch whose posttest restore never ran) is noise:
          # restore the tree to HEAD and drop untracked leftovers BEFORE the
          # collapse, or create-pull-request would bundle the pollution.
          git checkout -- .
          git clean -fd --quiet
          # Artifacts live in $RUNNER_TEMP, never in the working tree, so nothing
          # extra leaks into the PR.
          git reset --soft "${{ steps.fleet.outputs.base }}"

      # ── Detect real changes vs base branch (default mode only) ───────────────
      # After the soft-reset the index holds the NET delta of the entire fleet.
      # Compare that index against origin/main (or the configured base) to decide
      # whether the run actually produced useful work. An empty or noise-only diff
      # is a clean no-op: we skip the PR entirely and report success.
      - name: Detect changes vs base branch (default mode only)
        id: detect
        if: ${{ inputs.mode != 'pr_fix' }}
        shell: bash -l {0}
        run: |
          set -e
          RUN_LABEL="${{ inputs.run_label }}"
          progress() {
            # SQL via STDIN, not -c: psql only interpolates -v variables when the
            # command comes from stdin — with -c the :'var' syntax is a hard error.
            printf '%s' "INSERT INTO run_progress (run_label, line) VALUES (:'rl', left(:'ln', 2000));" \
              | docker exec -i nexus-postgres psql -U postgres -d nexus -q \
                  -v rl="$RUN_LABEL" -v ln="[$(date -u +%H:%M:%S)] $1" \
                  >/dev/null 2>&1 || true
          }
          BASE_REF="${TARGET_BASE_REF:-main}"
          git fetch origin "$BASE_REF" --quiet
          if git diff --cached --quiet "origin/${BASE_REF}"; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "→ No diff vs origin/${BASE_REF} — health check completed, no changes needed. Skipping PR."
            progress "no diff vs origin/${BASE_REF} — clean no-op, no PR"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "→ Changes detected vs origin/${BASE_REF} — will open PR."
            progress "changes detected vs origin/${BASE_REF} — opening PR"
          fi

      - name: Create Pull Request
        if: ${{ inputs.mode != 'pr_fix' && steps.detect.outputs.has_changes == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: nexus/${{ inputs.run_label }}
          base: main
          title: "nexus-loop: ${{ inputs.run_label }}"
          commit-message: "nexus-loop: apply ${{ inputs.agents }}-agent fleet changes (${{ inputs.run_label }})"
          body-path: ${{ runner.temp }}/pr-body.md
          delete-branch: true

      # ── pr_fix MODE: collapse the fleet's checkpoint commits into ONE commit on
      # the existing head branch and push to that SAME branch. Never creates a new
      # branch or PR; never touches main. No-diff is a clean no-op. ──────────────
      - name: Patch existing PR branch (pr_fix mode)
        id: prfix_push
        if: ${{ inputs.mode == 'pr_fix' }}
        shell: bash -l {0}
        run: |
          set -e
          # Defence in depth: re-assert the head ref is not the default branch even
          # if the resolve step were ever bypassed.
          case "$TARGET_HEAD_REF" in
            main|master)
              echo "Refusing to patch protected default branch"
              exit 1
              ;;
          esac
          # Drop anything the gate dirtied after the last agent commit (same
          # tree-purge as default mode) so only the fleet's delta is pushed.
          git checkout -- .
          git clean -fd --quiet
          # Collapse the per-agent checkpoint commits back to base, then re-stage
          # the net file delta as a single commit on the existing head branch.
          git reset --soft "${{ steps.fleet.outputs.base }}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "→ pr_fix: no diff — no fix was necessary; nothing pushed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -q -m "nexus: pr_fix ${{ inputs.run_label }} on $TARGET_HEAD_REF"
            git push origin "HEAD:$TARGET_HEAD_REF"
            echo "→ pr_fix: pushed fixes to existing head $TARGET_HEAD_REF"
          fi

      - name: Comment on the patched PR (pr_fix mode)
        if: ${{ inputs.mode == 'pr_fix' && steps.prfix_push.outputs.changed == 'true' && inputs.target_pr_number != '' }}
        shell: bash -l {0}
        run: |
          set -e
          gh pr comment "$TARGET_PR" --body "Nexus pr.fix run ${{ inputs.run_label }} pushed fixes to ${TARGET_HEAD_REF}." \
          || echo "could not comment on PR #$TARGET_PR (non-fatal)"
