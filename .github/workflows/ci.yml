name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1 — Lint + Typecheck (BLOCKING)
  # ────────────────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # Required: @prisma/client exports (PrismaClient, model types) are
        # generated, not shipped — without this, tsc fails with TS2305 on
        # every model import.
        env:
          PRISMA_PROVIDER: postgresql
        run: pnpm db:generate

      - name: Run ESLint
        run: pnpm lint

      - name: Run Typecheck
        run: pnpm typecheck

      # DS guards retirés (RÈGLE DESIGN #0 — liberté visuelle, seul impératif
      # composants Catalyst). Les scripts `pnpm ds:guard*` restent disponibles
      # en local mais ne gatent plus la CI. Ne pas ré-armer sans accord d'Adrien.

  # ────────────────────────────────────────────────────────────────
  # Job — SecDevOps gate (secret-leak scan)
  # ────────────────────────────────────────────────────────────────
  secops:
    name: SecDevOps gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Scanne fichiers suivis + arbre git. gitleaks/trufflehog absents sur le
      # runner -> fallback regex curée (masquée). Exit!=0 sur fuite -> bloque.
      - name: Secret-leak scan
        run: bash scripts/secrets-scan.sh --all

  # ────────────────────────────────────────────────────────────────
  # Job 2 — Vitest unit + integration tests (BLOCKING)
  # ────────────────────────────────────────────────────────────────
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    needs: lint-typecheck

    # LLM-touching modules (src/lib/llm/kimi.ts) throw at import time if
    # OPENAI_API_KEY is missing (ADR-011). Inject from secrets or a CI placeholder
    # so module load succeeds and mocks can take over.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' && secrets.OPENAI_API_KEY || 'sk-ci-vitest-placeholder' }}
      HYPERCLI_API_KEY: ${{ secrets.HYPERCLI_API_KEY }}
      HYPERCLI_BASE_URL: ${{ secrets.HYPERCLI_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # Use the default sqlite provider — the generated client types are
        # identical for sqlite/postgres so any provider works for typecheck
        # + Vitest (which exercises a sqlite local DB).
        run: pnpm db:generate

      - name: Push schema to local SQLite (integration tests touch real DB)
        env:
          DATABASE_URL: "file:./prisma/dev.db"
        run: pnpm exec prisma db push

      - name: Run Vitest
        run: pnpm test

  # ────────────────────────────────────────────────────────────────
  # Job 3 — Playwright E2E (NON-BLOCKING)
  # ────────────────────────────────────────────────────────────────
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      DATABASE_URL: "file:${{ github.workspace }}/prisma/dev.db"
      PRISMA_PROVIDER: sqlite
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' && secrets.OPENAI_API_KEY || 'sk-ci-e2e-placeholder' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN != '' && secrets.HF_TOKEN || 'hf-ci-placeholder' }}
      # src/lib/backend/mint-token.ts fails closed (throws) with no fallback
      # when this is unset — correct in production (never mint a token
      # without a real signing key), but E2E needs SOME value to exercise
      # any page that reaches the backend client. Not a real secret: the
      # backend this points at isn't reachable from CI anyway, so pages
      # depending on it degrade to an honest unavailable state — this only
      # stops the mint step itself from throwing before that point.
      BACKEND_SESSION_SIGNING_KEY: ci-e2e-placeholder-not-a-secret-16ch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Prepare SQLite for E2E
        run: |
          pnpm db:generate
          pnpm exec prisma db push

      - name: Seed E2E test user
        run: pnpm seed:test

      - name: Seed E2E test admin
        run: pnpm seed:test:admin

      - name: Run Playwright E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Job — SonarQube static analysis (NON-BLOCKING)
  # Runs on the GPU1 self-hosted runner: SonarQube is Tailscale-only
  # (100.88.191.49:9010), unreachable from GitHub-hosted runners.
  # ────────────────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube analysis
    runs-on: [self-hosted, gpu1]
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm -v "$PWD":/usr/src -e SONAR_TOKEN sonarsource/sonar-scanner-cli

  # ────────────────────────────────────────────────────────────────
  # Job 4 — Foundry smart contracts (BLOCKING when contracts/ touched)
  # ────────────────────────────────────────────────────────────────
  foundry:
    name: Foundry (smart contracts)
    runs-on: ubuntu-latest
    # Advisory for now: contracts are Phase 2, mainnet gated on audit (ADR-006).
    # Restore to blocking when contracts re-activate. lint/typecheck/vitest stay blocking.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build contracts
        working-directory: contracts
        run: forge build --sizes

      - name: Run Foundry tests
        working-directory: contracts
        run: forge test --summary -vvv

  # ── Gate de synthèse (doctrine Preuves, governance 2026-07-25) ─────────────
  # LE nom à exiger en required status check : « gate ». Émet proof.json — la
  # preuve machine-readable destinée à la page PROVEN LIVE (HPB), produite par
  # la CI, jamais par un agent. SonarQube exclu volontairement (radar
  # non-bloquant, doctrine « gates locales d'abord »).
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [lint-typecheck, secops, vitest, playwright, foundry]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Anti-faux-vert — aucun .only/.skip dans les tests
        run: |
          HITS=$(git grep -nE "\.(only|skip)\s*\(" -- "src/**/*.test.ts" "src/**/*.test.tsx" "tests/**" "e2e/**" 2>/dev/null | grep -v "allow-skip" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::.only/.skip détecté (théâtre statistique) — retirer, ou justifier par un commentaire // allow-skip"
            exit 1
          fi
          echo "OK — 0 .only/.skip (stock au câblage : 0)"

      - name: Verdict des jobs requis
        env:
          R_LINT: ${{ needs.lint-typecheck.result }}
          R_SECOPS: ${{ needs.secops.result }}
          R_VITEST: ${{ needs.vitest.result }}
          R_E2E: ${{ needs.playwright.result }}
          R_FOUNDRY: ${{ needs.foundry.result }}
        # Piège connu (mémoire #13) : vitest a `needs: lint-typecheck` — si lint
        # casse, vitest est SKIPPED ; ici skipped ≠ success → gate rouge, jamais
        # un faux vert par job sauté.
        run: |
          echo "lint=$R_LINT secops=$R_SECOPS vitest=$R_VITEST e2e=$R_E2E foundry=$R_FOUNDRY"
          for r in "$R_LINT" "$R_SECOPS" "$R_VITEST" "$R_E2E" "$R_FOUNDRY"; do
            if [ "$r" != "success" ]; then
              echo "::error::un job requis n'est pas vert (résultat: $r)"
              exit 1
            fi
          done
          echo "gate: tous les jobs requis sont verts"

      - name: Preuve — proof.json
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          R_LINT: ${{ needs.lint-typecheck.result }}
          R_SECOPS: ${{ needs.secops.result }}
          R_VITEST: ${{ needs.vitest.result }}
          R_E2E: ${{ needs.playwright.result }}
          R_FOUNDRY: ${{ needs.foundry.result }}
        run: |
          node -e '
            const fs = require("fs");
            fs.writeFileSync("proof.json", JSON.stringify({
              repo: process.env.GITHUB_REPOSITORY,
              sha: process.env.GITHUB_SHA,
              run_id: process.env.GITHUB_RUN_ID,
              run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              status: process.env.JOB_STATUS,
              checks: {
                lint_typecheck: process.env.R_LINT,
                secops: process.env.R_SECOPS,
                vitest: process.env.R_VITEST,
                playwright: process.env.R_E2E,
                foundry: process.env.R_FOUNDRY,
              },
              generated_by: "ci (jamais par un agent)",
              ts: new Date().toISOString(),
            }, null, 2));
          '
          cat proof.json

      - name: Upload preuve
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof
          path: proof.json
          retention-days: 30
