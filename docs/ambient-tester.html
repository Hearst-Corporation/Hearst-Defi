<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambient Tester - Hearst Connect</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            color: #FFFFFF;
            display: flex;
            min-height: 100vh;
        }
        
        .column {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            margin-bottom: 40px;
            font-size: 1.2rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 320px;
            padding: 24px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-header {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .card-value {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .card-stat {
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .accent-text {
            color: #A7FB90;
            font-weight: 500;
        }

        .button {
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 8px;
            transition: background 0.2s ease;
        }

        .button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Ambiance A: Pure Neutral */
        .theme-a {
            background-color: #000000;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }
        .theme-a .card {
            background-color: #0E0F0F;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Ambiance B: Warm Wealth */
        .theme-b {
            background-color: #050403;
            border-right: 1px solid rgba(212, 196, 170, 0.05);
        }
        .theme-b .card {
            background-color: #12100E;
            border: 1px solid rgba(212, 196, 170, 0.08);
        }

        /* Ambiance C: Midnight Blue */
        .theme-c {
            background-color: #03060D;
        }
        .theme-c .card {
            background-color: #0A111F;
            border: 1px solid rgba(148, 179, 242, 0.08);
        }
    </style>
</head>
<body>

    <!-- Ambiance A -->
    <div class="column theme-a">
        <div class="title">Ambiance A: Pure Neutral</div>
        <div class="card">
            <div class="card-header">Yield Vault</div>
            <div class="card-value">$11.00</div>
            <div class="card-stat">
                <span style="color: rgba(255,255,255,0.5)">Target APY</span>
                <span class="accent-text">8.0 - 15.0%</span>
            </div>
            <div class="button">View Details</div>
        </div>
    </div>

    <!-- Ambiance B -->
    <div class="column theme-b">
        <div class="title">Ambiance B: Warm Wealth</div>
        <div class="card">
            <div class="card-header">Yield Vault</div>
            <div class="card-value">$11.00</div>
            <div class="card-stat">
                <span style="color: rgba(255,255,255,0.5)">Target APY</span>
                <span class="accent-text">8.0 - 15.0%</span>
            </div>
            <div class="button">View Details</div>
        </div>
    </div>

    <!-- Ambiance C -->
    <div class="column theme-c">
        <div class="title">Ambiance C: Midnight Blue</div>
        <div class="card">
            <div class="card-header">Yield Vault</div>
            <div class="card-value">$11.00</div>
            <div class="card-stat">
                <span style="color: rgba(255,255,255,0.5)">Target APY</span>
                <span class="accent-text">8.0 - 15.0%</span>
            </div>
            <div class="button">View Details</div>
        </div>
    </div>

</body>
</html>
